type: task
name: logdiagnosis-sitl-canary

# Immutable linux/amd64 digest emitted by the verified GitHub build.
image: ghcr.io/beastayyg/ardupilot-log-diagnosis@sha256:4715d4cb0b0029bc668b3ced3843c155d74e33c2f29b40dfca9e09db7385678b
privileged: true
shell: bash

commands:
  - |
    set -Eeuo pipefail
    test "$(uname -m)" = x86_64
    test -d "$ARDUPILOT_ROOT/.git"
    git -C "$ARDUPILOT_ROOT" status --porcelain=v1 --untracked-files=no \
      --ignore-submodules=none | (! grep .)
    test -f "$ARDUPILOT_ATTESTATION"
    python - <<'PY'
    import hashlib
    import json
    import os
    import subprocess
    from pathlib import Path

    attestation = json.loads(Path(os.environ["ARDUPILOT_ATTESTATION"]).read_text())
    revision = subprocess.check_output(
        ["git", "-C", os.environ["ARDUPILOT_ROOT"], "rev-parse", "HEAD"],
        text=True,
    ).strip()
    digest = hashlib.sha256(
        Path(os.environ["ARDUPILOT_SITL_BINARY"]).read_bytes()
    ).hexdigest()
    if revision != attestation.get("commit"):
        raise SystemExit("source revision differs from image attestation")
    if digest != attestation.get("binary_sha256"):
        raise SystemExit("SITL binary differs from image attestation")
    print(json.dumps({"commit": revision, "binary_sha256": digest}, sort_keys=True))
    PY
    python -m synthetic_data cluster preflight | tee /tmp/preflight.json
    python - <<'PY'
    import json
    from pathlib import Path
    probe = json.loads(Path('/tmp/preflight.json').read_text(encoding='utf-8'))
    if not probe.get('capacity_ok'):
        raise SystemExit(probe.get('capacity_reason', 'capacity check failed'))
    if not probe.get('user_network_namespace_ok'):
        raise SystemExit(probe.get('reason', 'namespace check failed'))
    print('JarvisLabs privileged namespace canary passed')
    PY

backends: [jarvislabs]
fleets: [logdiagnosis-sitl-canary-fleet]
spot_policy: on-demand
retry:
  on_events: [no-capacity, interruption]
  duration: 30m
max_duration: 20m
stop_duration: 2m
idle_duration: 2m
# Jarvis' live API reports this CPU offer as 8.04 (INR). dstack 0.21.2
# compares the provider's raw numeric value, so keep a narrow 8.50 cap.
max_price: 8.50

resources:
  cpu: x86:4
  memory: 16GB
  disk: 100GB

