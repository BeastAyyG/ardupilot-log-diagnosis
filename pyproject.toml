[project]
name = "ardupilot-log-diagnosis"
version = "1.0.1"
description = "AI-powered ArduPilot .BIN diagnostic analyzer for flight log failure detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ArduPilot Log Diagnosis Team"}
]
keywords = ["ardupilot", "flight-log", "diagnostics", "machine-learning", "xgboost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pymavlink>=2.4.40,<3",
    "requests>=2.31,<3",
    "numpy>=1.26.4,<2",
    "scipy>=1.11.4,<1.13",
    "scikit-learn>=1.4.2,<1.5",
    "xgboost>=2.0.3,<2.2",
    "joblib>=1.3.2,<1.5",
    "pyyaml>=6.0,<7",
    "pandas>=2.1.4,<2.3",
    "imbalanced-learn>=0.12,<0.13",
    "matplotlib>=3.8,<3.10",
    "python-dotenv>=1.0,<2",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9",
    "httpx>=0.27,<0.29",
    "ruff>=0.15,<0.16",
    "black>=22.0.0",
    "mypy>=0.950",
    "fastapi>=0.110,<0.116",
    "uvicorn>=0.27,<0.35",
    "python-multipart>=0.0.9,<0.1",
]
web = [
    "fastapi>=0.110,<0.116",
    "uvicorn>=0.27,<0.35",
    "python-multipart>=0.0.9,<0.1",
]
forum = [
    "scrapegraph-py>=1.0.0",
    "crawlbase>=1.0.0",
    "scraperai>=0.1.0",
]

[project.scripts]
ardupilot-diagnosis = "src.cli.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.web" = ["index.html"]

[tool.setuptools.data-files]
"share/ardupilot-log-diagnosis/models" = [
    "models/*.joblib",
    "models/*.json",
    "models/*.yaml",
]
"share/ardupilot-log-diagnosis/simulation" = [
    "simulation/*.yaml",
]
"share/ardupilot-log-diagnosis/docs" = [
    "docs/TRUST_FIRST_IMPLEMENTATION.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["recovered_from_ardupilot_folder", "data", "archive", ".venv"]

[tool.ruff]
ignore = ["E402"]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
