name: Run ARM64 first SITL pair

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario from the approved catalog
        required: true
        default: motor_imbalance
        type: string
      frame:
        description: ArduPilot frame
        required: true
        default: quad
        type: choice
        options: [quad, hexa, octa]
      seed:
        description: Deterministic planning seed
        required: true
        default: '20260840'
        type: string

permissions:
  contents: read
  packages: read

env:
  SITL_IMAGE: ghcr.io/beastayyg/ardupilot-log-diagnosis@sha256:7fbd8efc8f568105be5a72f889ebf962357599d11dd6aaccf7b32202bea66be8

jobs:
  first-pair:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out launcher
        uses: actions/checkout@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run one verified pair
        env:
          PAIR_OUTPUT_DIR: ${{ github.workspace }}/artifacts/first-pair
          PAIR_SCENARIO: ${{ inputs.scenario }}
          PAIR_FRAME: ${{ inputs.frame }}
          PAIR_SEED: ${{ inputs.seed }}
        run: bash ops/dgx/run_first_pair.sh

      - name: Upload first-pair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-first-pair-evidence
          path: artifacts/first-pair
          if-no-files-found: error
          retention-days: 14
