name: Publish DGX Spark runtime overlay

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: Qualified immutable ARM64 image digest to overlay
        required: true
        type: string
      image_tag:
        description: Immutable overlay tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/beastayyg/ardupilot-log-diagnosis

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate immutable base
        env:
          BASE_IMAGE: ${{ inputs.base_image }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$BASE_IMAGE" =~ ^ghcr\.io/beastayyg/ardupilot-log-diagnosis@sha256:[0-9a-f]{64}$ ]]
          [[ "$IMAGE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]]
      - name: Publish native ARM64 runtime overlay
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: synthetic_data/cluster/containers/Dockerfile.ardupilot-sitl-overlay
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: BASE_IMAGE=${{ inputs.base_image }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ inputs.image_tag }}
            ${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}
      - name: Publish digest summary
        run: |
          echo "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
