name: Publish JarvisLabs SITL candidate image

on:
  workflow_dispatch:
    inputs:
      ardupilot_commit:
        description: Exact 40-character ArduPilot commit
        required: true
        type: string
      base_digest:
        description: Verified manifest digest for python:3.12-slim-bookworm
        required: true
        type: string
      image_tag:
        description: Immutable candidate tag, for example jarvis-canary-2026-08-25
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  # GHCR image references are case-sensitive and must be lowercase. GitHub's
  # repository owner expression preserves account capitalization.
  GHCR_IMAGE: ghcr.io/beastayyg/ardupilot-log-diagnosis

concurrency:
  group: publish-jarvislabs-${{ inputs.image_tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate immutable inputs
        env:
          ARDUPILOT_COMMIT: ${{ inputs.ardupilot_commit }}
          BASE_DIGEST: ${{ inputs.base_digest }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$ARDUPILOT_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$BASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$IMAGE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]]
      - name: Install test dependencies
        run: |
          python -m pip install -e ".[dev]" -c synthetic_data/constraints.txt
          # Match the repository CI lint baseline; newer Ruff releases add
          # rules not included in this project's configured quality gate.
          python -m pip install ruff==0.15.22
      - name: Verify cluster and collection contracts
        run: |
          python -m ruff check synthetic_data training src
          python -m pytest \
            tests/test_cluster_ops.py \
            tests/test_cluster_scheduler.py \
            tests/test_cluster_topology.py \
            tests/test_coordinator.py \
            tests/test_distributed_contracts.py \
            tests/test_frame_merge.py \
            tests/test_network_isolation.py \
            tests/test_sitl_isolation.py \
            tests/test_collector_trajectory.py -q

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish native x86_64 candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: synthetic_data/cluster/containers/Dockerfile.ardupilot-sitl
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            ARDUPILOT_COMMIT=${{ inputs.ardupilot_commit }}
            BASE_DIGEST=${{ inputs.base_digest }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ inputs.image_tag }}
            ${{ env.GHCR_IMAGE }}:jarvis-sha-${{ github.sha }}
      - name: Publish digest summary
        run: |
          echo "### JarvisLabs x86_64 candidate" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate only: run the privileged namespace canary before a campaign." >> "$GITHUB_STEP_SUMMARY"
